# Local production-like stack: http://localhost:3000 (UI) -> nginx -> FastAPI
# Override host ports with FRONTEND_PORT / BACKEND_PORT if they are taken.
services:
  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}/
      LOG_LEVEL: INFO
    volumes:
      - elexon-cache:/app/.cache   # keep downloaded Elexon data across restarts
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  elexon-cache:
